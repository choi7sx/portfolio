<!-- Cream cut, for the coming soon page's dark photographic wall. This is
     the dew-50 step (#FFF5CC), the same tone the headline there is set in.
     Baked in rather than tokenised because an SVG loaded through <img>
     cannot read CSS custom properties: if dew-50 moves, move this too.
     Wordmark colour lives on this one rect. The mask carries the
     letterforms, so the counters are transparent and the logo no
     longer depends on mix-blend-mode to hide white counter shapes. -->
<rect x="60" y="650" width="1930" height="660" fill="#FFF5CC" mask="url(#md-wordmark-cream)"/>
</svg>
